name: Build X96 Mediabox

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build launcher APK
        working-directory: launcher
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'versionName "\K[^"]+' launcher/app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Fetch Kodi repository zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p kodi/zips
          # Elementum: nieuwste release van de officiele ElementumOrg-repository
          url=$(gh api repos/ElementumOrg/repository.elementumorg/releases/latest \
                --jq '.assets[] | select(.name | test("^repository\\.elementumorg-.*\\.zip$")) | .browser_download_url' | head -n1)
          test -n "$url"
          curl -fsSL "$url" -o "kodi/zips/$(basename "$url")"
          # jurialmunkey (Arctic Fuse 2 / Arctic Horizon 2): zip staat op de github.io-pagina
          base=https://jurialmunkey.github.io/repository.jurialmunkey/
          zip=$(curl -fsSL "$base" | grep -oE 'repository\.jurialmunkey-[0-9.]+\.zip' | sort -V | tail -n1)
          test -n "$zip"
          curl -fsSL "$base$zip" -o "kodi/zips/$zip"
          # a4kSubtitles (ondertitels): repository-zip en de add-on zelf
          base=https://a4k-openproject.github.io/a4kSubtitles/packages/
          curl -fsSL "$base" -o /tmp/a4k-index.html
          grep -oE 'href="[^"]+"' /tmp/a4k-index.html | sort -u || true
          curl -fsSL "${base}a4kSubtitles-repository.zip" -o kodi/zips/a4kSubtitles-repository.zip
          mkdir -p /tmp/a4k && unzip -oq kodi/zips/a4kSubtitles-repository.zip -d /tmp/a4k
          cat /tmp/a4k/*/addon.xml
          tag=$(gh api repos/a4k-openproject/a4kSubtitles/tags --jq '.[0].name')
          echo "a4kSubtitles tag: $tag"
          curl -fsSL "https://github.com/a4k-openproject/a4kSubtitles/archive/refs/tags/$tag.tar.gz" -o /tmp/a4k-src.tgz
          mkdir -p /tmp/a4ksrc && tar -xzf /tmp/a4k-src.tgz -C /tmp/a4ksrc
          src=$(ls -d /tmp/a4ksrc/*/)
          head -n 20 "$src/addon.xml"
          id=$(grep -oP '<addon[^>]*id="\K[^"]+' "$src/addon.xml" | head -n1)
          ver=$(grep -oP '<addon[^>]*version="\K[^"]+' "$src/addon.xml" | head -n1)
          rm -rf "/tmp/pkg-a4k" && mkdir -p "/tmp/pkg-a4k/$id"
          (cd "$src" && tar --exclude=.git --exclude=.github --exclude=tests --exclude=.githooks -cf - .) | tar -xf - -C "/tmp/pkg-a4k/$id"
          (cd /tmp/pkg-a4k && zip -qr "$GITHUB_WORKSPACE/kodi/zips/$id-$ver.zip" "$id")
          ls -la kodi/zips
          for z in kodi/zips/*.zip; do unzip -tq "$z"; done

      - name: Package
        run: |
          set -euo pipefail
          v=${{ steps.ver.outputs.version }}
          cp launcher/app/build/outputs/apk/release/app-release.apk "x96-launcher-$v.apk"
          mkdir -p pkg/x96-mediabox
          cp -r README.md START.bat docs tools kodi pkg/x96-mediabox/
          cp "x96-launcher-$v.apk" pkg/x96-mediabox/
          (cd pkg && zip -qr "../x96-mediabox-$v.zip" x96-mediabox)
          unzip -l "x96-mediabox-$v.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x96-mediabox
          path: |
            x96-mediabox-${{ steps.ver.outputs.version }}.zip
            x96-launcher-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: X96 Mediabox ${{ steps.ver.outputs.version }}
          files: |
            x96-mediabox-${{ steps.ver.outputs.version }}.zip
            x96-launcher-${{ steps.ver.outputs.version }}.apk
          make_latest: true
